[build]
 command = "node scripts/build.mjs"
 publish = "dist"
[build.environment]
 NODE_VERSION = "20"
[[headers]]
 for = "/admin/*"
 [headers.values]
  X-Robots-Tag = "noindex, nofollow"
[[headers]]
 for = "/*"
 [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
