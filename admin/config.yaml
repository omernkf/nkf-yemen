backend:
  name: github
  repo: omernkf/nkf-yemen  # تأكد أن هذا هو اسم المستودع الخاص بك بالضبط (اسم المستخدم/اسم المستودع)
  branch: main              # تأكد أن هذا هو اسم الفرع الرئيسي لديك (main أو master)
  commit_messages:
    create: "CMS: Create {{slug}}"
    update: "CMS: Update {{slug}}"
    delete: "CMS: Delete {{slug}}"
    uploadMedia: "CMS: Upload {{path}}"
    deleteMedia: "CMS: Delete {{path}}"

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "home"
        fields:
          - { name: hero_title_en, label: "Hero Title (English)", widget: "string" }
          - { name: hero_title_ar, label: "Hero Title (Arabic)", widget: "string" }
          - { name: hero_description_en, label: "Hero Description (English)", widget: "text" }
          - { name: hero_description_ar, label: "Hero Description (Arabic)", widget: "text" }
          - { name: hero_image, label: "Hero Image", widget: "image" }
      - file: "about-us.html"
        label: "About Us Page"
        name: "about"
        fields:
          - { name: page_title_en, label: "Page Title (English)", widget: "string" }
          - { name: page_title_ar, label: "Page Title (Arabic)", widget: "string" }
          - { name: content_en, label: "Content (English)", widget: "markdown" }
          - { name: content_ar, label: "Content (Arabic)", widget: "markdown" }
  - name: "programs"
    label: "Programs"
    folder: "_data/programs"
    create: true
    fields:
      - { name: title_en, label: "Title (English)", widget: "string" }
      - { name: title_ar, label: "Title (Arabic)", widget: "string" }
      - { name: summary_en, label: "Summary (English)", widget: "text" }
      - { name: summary_ar, label: "Summary (Arabic)", widget: "text" }
      - { name: image, label: "Image", widget: "image" }