<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>إدارة NKF Yemen</title>
</head>
<body>
<script>
(function () {
  // Mobile Chrome sometimes opens GitHub authorization in a separate tab,
  // which removes window.opener. Keep the CMS tab open to receive the result.
  // Decap expects a live window.open() handle and calls focus(), postMessage(),
  // and close() on it during the OAuth handshake. On some mobile browsers the
  // GitHub authorization navigation severs that handle (COOP), although its
  // first-party callback can still send the result through BroadcastChannel.
  // Forward methods when possible, but never let a detached popup handle
  // interrupt Decap's own successful OAuth callback.
  const nativeOpen = window.open.bind(window);
  window.open = function(url, name, features) {
    const popup = nativeOpen(url, name, features);
    if (name !== 'Netlify Authorization' || !popup) return popup;
    return {
      focus() {
        try { popup.focus(); } catch (_) { /* detached popup */ }
      },
      postMessage(message, origin) {
        try { if (!popup.closed) popup.postMessage(message, origin); }
        catch (_) { /* callback uses same-origin BroadcastChannel */ }
      },
      close() {
        try { if (!popup.closed) popup.close(); }
        catch (_) { /* browser owns detached tab */ }
      }
    };
  };

  if (!('BroadcastChannel' in window)) return;
  const channel = new BroadcastChannel('nkf-decap-oauth');
  channel.onmessage = (event) => {
    if (!event.data || event.data.type !== 'oauth-success') return;
    if (typeof event.data.message !== 'string' ||
        !event.data.message.startsWith('authorization:github:success:')) return;
    // Decap waits for an authorizing:github handshake before it listens
    // for the authorization:github:success response. Forward BOTH messages.
    // Merely forwarding the success message leaves Decap on its login screen.
    window.postMessage('authorizing:github', window.location.origin);
    setTimeout(() => {
      window.postMessage(event.data.message, window.location.origin);
      // Acknowledgment only means the message was relayed, not that login succeeded.
      channel.postMessage({type:'oauth-received'});
    }, 150);
  };
  window.addEventListener('pagehide', () => channel.close());
})();
</script>
<script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
</body>
</html>
